<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismica | Analytics</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-titles">
            <h1>Seismica Analytics</h1>
            <p>30-Day Historical Data & Trends</p>
        </div>
        <nav class="header-nav">
            <a href="index.html">Live Map</a>
            <a href="analytics.html" class="active">Analytics</a>
            <button id="darkModeToggle" class="toggle-btn">Dark Mode</button>
        </nav>
    </header>

    <div class="dashboard-grid">
        <!-- 30-Day Time-lapse Map -->
        <div class="dashboard-card map-card">
            <h3>30-Day Time-lapse</h3>
            <div id="analyticsMap" style="height: 300px; width: 100%; border-radius: 8px;"></div>
            <div class="playback-controls">
                <button id="playBtn" class="toggle-btn">Play</button>
                <input type="range" id="timelapseSlider" min="0" max="100" value="100">
                <span id="timelapseLabel">Loading...</span>
            </div>
        </div>

        <!-- Gutenberg-Richter Histogram -->
        <div class="dashboard-card">
            <h3>Magnitude Distribution (Gutenberg-Richter)</h3>
            <canvas id="histogramChart"></canvas>
        </div>

        <!-- Timeline Chart -->
        <div class="dashboard-card">
            <h3>Frequency & Magnitude Timeline</h3>
            <canvas id="timelineChart"></canvas>
        </div>

        <!-- Leaderboard -->
        <div class="dashboard-card">
            <h3>30-Day Leaderboard (Top 5)</h3>
            <ul id="leaderboardList" class="leaderboard">
                <li>Loading data...</li>
            </ul>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>
    <script src="analytics.js"></script>
</body>
</html>
