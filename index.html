<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismica | Live Earthquakes</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader">
        <div class="epicenter"></div>
        <p class="loading-text">Synchronizing seismic feeds...</p>
    </div>

    <header>
        <h1>Seismica</h1>
        <p>Real-time global seismic activity</p>
    </header>

    <div id="map"></div>

    <!-- New Timeline Slider -->
    <div id="timeline-container">
        <label for="timeSlider" id="timeLabel">Displaying all recent activity</label>
        <input type="range" id="timeSlider" min="0" max="100" value="100">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
